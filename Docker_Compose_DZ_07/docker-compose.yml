services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homework
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d homework"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-homework-secret}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://app:app@db:5432/homework
      SQLALCHEMY_PG_CONN_URI: postgresql+asyncpg://app:app@db:5432/homework
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --access-logfile - --error-logfile - app:app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
