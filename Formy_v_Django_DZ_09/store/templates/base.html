<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --text: #20242a;
            --muted: #68707c;
            --line: #d9dee7;
            --accent: #1769aa;
            --accent-dark: #0f4e81;
            --danger: #b3261e;
            --success-bg: #e6f4ea;
            --success: #176b35;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            color: var(--accent-dark);
            text-decoration: underline;
        }

        .site-header {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .container {
            width: min(100% - 32px, 1080px);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 64px;
        }

        .brand {
            color: var(--text);
            font-size: 22px;
            font-weight: 700;
        }

        .nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .main {
            padding: 32px 0 48px;
        }

        .page-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.2;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 22px;
        }

        p {
            margin: 0 0 12px;
        }

        .muted {
            color: var(--muted);
        }

        .button,
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover,
        button:hover {
            background: var(--accent-dark);
            color: #ffffff;
            text-decoration: none;
        }

        .button.secondary {
            background: transparent;
            color: var(--accent);
        }

        .button.secondary:hover {
            background: #e9f2fb;
            color: var(--accent-dark);
        }

        .messages {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 6px;
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #b8dfc2;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .product-card,
        .detail-panel,
        .form-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        .product-card {
            display: grid;
            gap: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: 700;
        }

        .detail-list {
            display: grid;
            grid-template-columns: minmax(140px, 220px) 1fr;
            gap: 12px 20px;
            margin: 0;
        }

        .detail-list dt {
            color: var(--muted);
            font-weight: 700;
        }

        .detail-list dd {
            margin: 0;
        }

        .form-panel {
            max-width: 720px;
        }

        .form-field {
            display: grid;
            gap: 6px;
            margin-bottom: 18px;
        }

        label {
            font-weight: 700;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 40px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
        }

        textarea {
            resize: vertical;
        }

        .errorlist {
            margin: 0;
            padding-left: 20px;
            color: var(--danger);
        }

        .form-actions,
        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 640px) {
            .topbar,
            .page-head {
                align-items: stretch;
                flex-direction: column;
            }

            .detail-list {
                grid-template-columns: 1fr;
                gap: 4px 0;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container topbar">
            <a class="brand" href="{% url 'store:product_list' %}">Магазин</a>
            <nav class="nav" aria-label="Основная навигация">
                <a href="{% url 'store:product_list' %}">Товары</a>
                <a href="{% url 'store:product_create' %}">Добавить товар</a>
                <a href="{% url 'admin:index' %}">Админка</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <div class="message">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}

            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
