{% extends "base.html" %}

{% block title %}Новая запись{% endblock %}

{% block content %}
<h1>Новая запись</h1>
<p><a href="{{ url_for('posts') }}">К списку</a></p>

<form method="post">
    <label>
        Автор
        <select name="user_id" required>
            <option value="">Выберите пользователя</option>
            {% for user in users %}
                <option value="{{ user.id }}" {% if form.get("user_id") == user.id|string %}selected{% endif %}>
                    {{ user.name }} (@{{ user.username }})
                </option>
            {% endfor %}
        </select>
    </label>
    <label>
        Заголовок
        <input name="title" maxlength="255" value="{{ form.get('title', '') }}" required>
    </label>
    <label>
        Текст
        <textarea name="body" required>{{ form.get("body", "") }}</textarea>
    </label>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
